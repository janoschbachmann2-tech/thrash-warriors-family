<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trash Warriors – Familie einrichten</title><style>body{background:#0b090c;color:#f5e7d8;font:18px system-ui;margin:0}main{max-width:600px;margin:40px auto;padding:24px;border:2px solid #a92b45}input{display:block;box-sizing:border-box;width:100%;padding:12px;background:#171319;color:white;border:1px solid #82505b;margin:8px 0 22px}button{padding:16px;background:#a51b3e;color:white;border:0;font:inherit}a{color:#ffcb39}</style><main><h1>TRASH WARRIORS</h1><h2>Familie einmalig einrichten</h2><p>Janosch: Den Einrichtungsschlüssel findest du bei Render unter Environment → SETUP_KEY. Er ist nur für diese einmalige Einrichtung nötig.</p><form id="setup"><label>Einrichtungsschlüssel<input name="setupKey" type="password" required minlength="32" autocomplete="off"></label><div id="players"></div><button>Familie einrichten</button></form><p id="status" role="status"></p><a href="/">Zum Spiel →</a></main><script>const form=document.querySelector('form');for(const name of ['Janosch','Tanja','Mio','Nele']){let label=document.createElement('label');label.textContent=name+' – eigenes Passwort';let input=document.createElement('input');Object.assign(input,{name,type:'password',required:true,minLength:8,maxLength:80,autocomplete:'new-password'});label.append(input);document.querySelector('#players').append(label)}form.onsubmit=async e=>{e.preventDefault();let status=document.querySelector('#status'),button=form.querySelector('button');button.disabled=true;status.textContent='Wird eingerichtet …';try{let r=await fetch('/api/game/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});let data=await r.json();if(!r.ok)throw Error(data.error);form.reset();form.hidden=true;status.textContent='Familie eingerichtet. Ihr könnt euch jetzt im Spiel anmelden.'}catch(error){status.textContent=error.message}finally{button.disabled=false}};</script></html>
